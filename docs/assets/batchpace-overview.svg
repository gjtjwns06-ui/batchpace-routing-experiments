<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="440" viewBox="0 0 1280 440" role="img" aria-labelledby="title desc">
  <title id="title">BatchPace routing experiments</title>
  <desc id="desc">A shared global budget routes each batch to a cheap or strong model. Five experiment suites include 174 environment configurations and 94,240 policy runs, with eight budgets and ten replay seeds.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#0b1728"/>
      <stop offset="1" stop-color="#132e3b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#5eead4"/>
      <stop offset="1" stop-color="#93c5fd"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#d1fae5" stroke-opacity="0.035"/>
    </pattern>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0L8 4L0 8Z" fill="#7f9cae"/>
    </marker>
  </defs>
  <rect width="1280" height="440" rx="20" fill="url(#background)"/>
  <rect width="1280" height="440" rx="20" fill="url(#grid)"/>
  <rect x="48" y="44" width="5" height="18" rx="2" fill="#5eead4"/>
  <g font-family="Segoe UI, Inter, Arial, sans-serif">
    <text x="66" y="58" fill="#a9c7d4" font-size="14" font-weight="600" letter-spacing="2.2">BATCHPACE / RESEARCH ARTIFACTS</text>
    <text x="48" y="139" fill="#f8fafc" font-size="56" font-weight="700" letter-spacing="-1.8">One budget.</text>
    <text x="48" y="204" fill="url(#accent)" font-size="56" font-weight="700" letter-spacing="-1.8">Every batch counts.</text>
    <text x="50" y="250" fill="#bed0dc" font-size="18">Synthetic + cached local-LLM routing experiments</text>
    <text x="50" y="280" fill="#7f9cae" font-size="15">Distribution shift / Stationary workloads / Reproducible results</text>

    <rect x="692" y="100" width="114" height="144" rx="14" fill="#172f42" stroke="#385264"/>
    <text x="711" y="127" fill="#b9ccd8" font-size="12" font-weight="600" letter-spacing="1.3">BATCH t</text>
    <g fill="#84a5b9">
      <rect x="712" y="146" width="18" height="18" rx="4"/>
      <rect x="740" y="146" width="18" height="18" rx="4"/>
      <rect x="768" y="146" width="18" height="18" rx="4"/>
      <rect x="712" y="174" width="18" height="18" rx="4"/>
      <rect x="740" y="174" width="18" height="18" rx="4" fill="#5eead4"/>
      <rect x="768" y="174" width="18" height="18" rx="4" fill="#5eead4"/>
    </g>
    <text x="712" y="222" fill="#8faebe" font-size="12">20 queries</text>

    <path d="M808 173H852" fill="none" stroke="#7f9cae" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="865" y="124" width="159" height="98" rx="15" fill="#164247" stroke="#5eead4" stroke-opacity="0.7"/>
    <text x="944" y="161" fill="#f0fdfa" font-size="21" font-weight="600" text-anchor="middle">BatchPace</text>
    <text x="944" y="190" fill="#8cdaca" font-size="13" text-anchor="middle">choose k / preserve B</text>

    <path d="M1026 157H1052V115H1084M1026 190H1052V231H1084" fill="none" stroke="#7f9cae" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="1094" y="84" width="138" height="62" rx="12" fill="#183a42" stroke="#4d8a8c"/>
    <text x="1163" y="111" fill="#ccfbf1" font-size="15" font-weight="600" text-anchor="middle">Cheap model</text>
    <text x="1163" y="131" fill="#86aaa9" font-size="12" text-anchor="middle">remaining queries</text>
    <rect x="1094" y="200" width="138" height="62" rx="12" fill="#3b302b" stroke="#b88b67"/>
    <text x="1163" y="227" fill="#ffedd5" font-size="15" font-weight="600" text-anchor="middle">Strong model</text>
    <text x="1163" y="247" fill="#d0ad8d" font-size="12" text-anchor="middle">selected k queries</text>
    <text x="865" y="279" fill="#8faebe" font-size="13">carry the remaining budget to batch t + 1</text>

    <path d="M48 326H1232" stroke="#36505f"/>
    <g fill="#f8fafc" font-size="31" font-weight="600">
      <text x="50" y="377">174</text>
      <text x="360" y="377">94,240</text>
      <text x="690" y="377">8</text>
      <text x="1000" y="377">10</text>
    </g>
    <g fill="#9eb6c4" font-size="13" letter-spacing="1.2">
      <text x="50" y="405">ENVIRONMENT CONFIGURATIONS</text>
      <text x="360" y="405">POLICY RUNS</text>
      <text x="690" y="405">GLOBAL BUDGETS</text>
      <text x="1000" y="405">REPLAY SEEDS</text>
    </g>
  </g>
</svg>
